<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DayFrame</title>
<style>
body{margin:0;background:#f8f7f2;color:#2c352b;font:16px "Microsoft YaHei UI",sans-serif;min-height:100vh;display:grid;place-items:center}.startup{text-align:center;max-width:580px;padding:40px}.sprout{font-size:42px;color:#71836a}h1{font:40px Georgia,serif;margin:18px 0}p{color:#7e8278;line-height:1.9;white-space:pre-line}.error{color:#9a5146}small{display:block;color:#7e8278;margin-top:25px}
</style>
<div class="startup"><div class="sprout">❦</div><h1>dayframe</h1><p id="message">正在打开你的本地档案…</p><small>每一帧，都是生活的答案。</small></div>
<script>window.dayframeStartupError=function(message){const node=document.getElementById('message');node.className='error';node.textContent=message}</script>
</html>
